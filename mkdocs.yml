site_name: ColdIgniter User Guide
site_description: The user guide of ColdIgniter, a CFML port of CodeIgniter 4.
site_url: https://coldigniter.dev/user_guide/
# No repo_url: with it the theme asks api.github.com for the star count
# from the browser of every visitor. The welcome page links the repositories.

# The pages are in guide/. The site is built into dist/user_guide/ so that
# the files have the same path as their address: /user_guide/...
docs_dir: guide
site_dir: dist/user_guide
strict: true
# Every page is a file with its own address, as in the CodeIgniter guide:
# installation/index.html, general/controllers.html.
use_directory_urls: false

theme:
  name: material
  # No request to another host: no web fonts.
  font: false
  logo: images/logo.svg
  favicon: images/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark colours
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light colours
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

